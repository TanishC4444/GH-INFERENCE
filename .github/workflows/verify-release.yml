name: Verify release on GitHub
on:
  push:
    paths-ignore: ['verification-results/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' build twine
      - name: Tests, distribution and Hub metadata
        env:
          REPORT_TOKEN: ${{ github.token }}
        run: python .github/verify_release.py
