name: Resident session smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m pip install --only-binary=llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu 'llama-cpp-python==0.3.36'
      - name: Real stateless inference and constrained evidence IDs
        run: |
          python - <<'PY'
          import json
          from gh_inference import ResidentSession
          schema={'type':'object','properties':{'evidence_id':{'type':'string','enum':['e001']}},'required':['evidence_id'],'additionalProperties':False}
          with ResidentSession('qwen0.5b',n_ctx=4096) as s:
              first,a=s.complete('Return JSON selecting evidence_id e001.',max_tokens=64,response_schema=schema)
              second,b=s.complete('Return JSON selecting evidence_id e001. This is a separate request.',max_tokens=64,response_schema=schema)
              assert json.loads(first)=={'evidence_id':'e001'}
              assert json.loads(second)=={'evidence_id':'e001'}
              assert b['model_reused'] and b['context_reset']
              print(json.dumps({'first':a,'second':b},indent=2))
          PY
