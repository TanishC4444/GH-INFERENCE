name: Publish Python package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this tested version to PyPI
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' build twine
      - run: python -m pytest -q
      - run: python -m build && python -m twine check dist/*
      - name: Verify installed wheel outside checkout
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -c 'from gh_inference import Agent, list_quantizations; from gh_ai_runner import __version__; assert __version__ == "0.5.0"'
          /tmp/wheel-check/bin/gh-inference --help
          /tmp/wheel-check/bin/gh-inference models
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
  publish:
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gh-inference/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
